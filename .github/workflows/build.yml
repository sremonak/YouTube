name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VIDORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "VIDORA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release keystore configured"
          else
            echo "No release keystore secret — APK will be signed with the debug key"
          fi

      - name: Version
        run: |
          echo "VIDORA_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VIDORA_VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VIDORA_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.VIDORA_KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler / Gradle errors as annotations (visible on the PR & checks page)
          { grep -E "^e: |^ERROR|error:|Could not (find|resolve)|Execution failed|FAILED|AssertionError|Exception at" build.log || true
            awk '/What went wrong:/{f=1} f&&n<25{print;n++}' build.log; } | head -c 30000 > errors.txt
          python3 - <<'PY'
          text = open("errors.txt").read()
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:9]
          for c in chunks:
              print("::error title=Build error::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Vidora-${VIDORA_VERSION_NAME}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidora-${{ env.VIDORA_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
