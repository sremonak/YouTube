name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.VIDORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "VIDORA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release keystore configured"
          else
            echo "No release keystore secret — APK will be signed with the debug key"
          fi

      - name: Version
        run: |
          echo "VIDORA_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VIDORA_VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VIDORA_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VIDORA_KEYSTORE_PASSWORD: ${{ secrets.VIDORA_KEYSTORE_PASSWORD }}
          VIDORA_KEY_ALIAS: ${{ secrets.VIDORA_KEY_ALIAS }}
          VIDORA_KEY_PASSWORD: ${{ secrets.VIDORA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --dependency-verification strict assembleRelease testDebugUnitTest assembleDebugAndroidTest :benchmark:assembleBenchmark lintDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler / Gradle errors as annotations (visible on the PR & checks page)
          { grep -E "^e: |^ERROR|error:|Could not (find|resolve)|Execution failed|FAILED|AssertionError|Exception at" build.log || true
            awk '/What went wrong:/{f=1} f&&n<25{print;n++}' build.log; } | head -c 30000 > errors.txt
          python3 - <<'PY'
          text = open("errors.txt").read()
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:9]
          for c in chunks:
              print("::error title=Build error::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Enable KVM for deterministic release gate
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 11 delayed-player and Home regression gate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          avd-name: vidora-api30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/guest-gate.sh android11

      - name: Guest emulator release gate
        env:
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          avd-name: vidora-api34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/guest-gate.sh

      - name: Report emulator assertions
        if: failure()
        run: |
          python3 - <<'PYASSERT'
          import pathlib,xml.etree.ElementTree as ET
          for path in pathlib.Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              try: root=ET.parse(path).getroot()
              except ET.ParseError: continue
              for case in root.iter('testcase'):
                  for tag in ('failure','error'):
                      err=case.find(tag)
                      if err is not None:
                          msg=((err.get('message') or '')+' '+(err.text or ''))[:5000]
                          msg=msg.replace('%','%25').replace('\n','%0A').replace('\r','')
                          print('::error title='+case.get('name','emulator')+'::'+msg)
          PYASSERT

      - name: Return UI snapshot candidates for review
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYUI'
          import pathlib,gzip,base64,json
          for image in pathlib.Path('app/build/reports/ui-snapshots').glob('*.png'):
              payload=json.dumps({'name':image.name,'png_base64':base64.b64encode(image.read_bytes()).decode()})
              encoded=base64.b64encode(gzip.compress(payload.encode())).decode()
              comment=pathlib.Path('/tmp/ui-'+image.stem+'.txt')
              comment.write_text('VIDORA_UI_CANDIDATE\n'+encoded)
          PYUI
          for file in /tmp/ui-*.txt; do
            [ -f "$file" ] || continue
            gh pr comment 1 --body-file "$file"
          done

      - name: Dependency inventory
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependency-inventory.txt

      - name: Test reports and dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            gradle/verification-metadata.xml
            dependency-inventory.txt
          retention-days: 7

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Vidora-${VIDORA_VERSION_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vidora-${{ env.VIDORA_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      # Every successful push publishes a GitHub release, so the app's built-in updater
      # (Settings → Check for updates) and https://github.com/<repo>/releases/latest get the APK
      # directly — no zip artifacts or GitHub login needed on the phone.
      - name: Publish update release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VIDORA_VERSION_NAME}"
          git log -1 --pretty=%B > notes.txt
          # Source access belongs on the binary download page, not in the app UI.
          printf '\nCorresponding source (GPLv3) for this APK: https://github.com/%s/archive/refs/tags/%s.zip\n' "$GITHUB_REPOSITORY" "$tag" >> notes.txt
          printf 'Build instructions and licence: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$tag" >> notes.txt
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Vidora ${VIDORA_VERSION_NAME}" --notes-file notes.txt --latest
          # Keep recent binary releases plus the upgrade baseline. Preserve source tags so
          # previously distributed APKs retain their corresponding GPL source archive URLs.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName != "v1.0.108")) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Corresponding source (GPLv3) for this APK: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip
            Build instructions and licence: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
