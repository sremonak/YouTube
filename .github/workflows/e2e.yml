name: Playback E2E (emulator)

# Runs the real-network playback checks (EJS solver in a real WebView, TV / Safari HLS / mobile web
# clients, comments) on an Android emulator. Manual, or when the E2E test itself changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon -q 2>&1 | tee /tmp/build.log | tail -40

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            ./gradlew connectedDebugAndroidTest --no-daemon --continue > /tmp/test.log 2>&1 || echo "TESTS_FAILED" >> /tmp/test.log
            adb logcat -d -s E2E:I TvPlayer:W JsChallengeSolver:W ContentRepository:W AndroidRuntime:E > /tmp/e2e.log || true

      - name: Report
        if: always()
        run: |
          set +e
          esc() { sed 's/%/%25/g' | tr '\n' '\001' | sed 's/\x01/%0A/g'; }
          if [ -f /tmp/e2e.log ]; then
            echo "::notice title=E2E log::$(grep -E 'E2E|TvPlayer|JsChallenge|ContentRepository|FATAL|Exception' /tmp/e2e.log | cut -c1-400 | head -80 | esc)"
          fi
          for f in $(find app/build -path '*androidTest-results*' -name '*.xml' 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for tc in root.iter('testcase'):
              name = tc.get('name')
              fail = tc.find('failure')
              if fail is None:
                  print(f"::notice title=E2E PASS {name}::ok")
              else:
                  msg = (fail.text or fail.get('message') or '')[:1500].replace('%', '%25').replace('\n', '%0A')
                  print(f"::error title=E2E FAIL {name}::{msg}")
          PY
          done
          if [ -f /tmp/test.log ]; then
            echo "::notice title=E2E gradle tail::$(tail -30 /tmp/test.log | cut -c1-300 | esc)"
          fi
          if [ -f /tmp/build.log ] && grep -q "^e: " /tmp/build.log; then
            echo "::error title=E2E compile::$(grep -E '^e: ' /tmp/build.log | head -20 | esc)"
          fi
          echo "xml: $(find app/build -path '*androidTest-results*' -name '*.xml' 2>/dev/null | head)"
          if grep -q TESTS_FAILED /tmp/test.log 2>/dev/null; then exit 1; fi
          exit 0
